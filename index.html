<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Kids Tuition</title>

<style>
body{
    margin:0;
    font-family:"Comic Sans MS", cursive;
    background: linear-gradient(to bottom, #fff7d1, #dff6ff);
    overflow-x:hidden;
}

/* 🌈 SOFT RAINBOW HEADER */
.header{
    text-align:center;
    padding:18px;
    font-size:38px;
    font-weight:bold;
    color:white;
    background: linear-gradient(90deg, #ff4d4d, #ffb703, #00bbf9, #38b000, #9b5de5);
    box-shadow:0 5px 20px rgba(0,0,0,0.2);
    letter-spacing:1px;
}

/* 🪄 LOGO BADGE */
.logo{
    width:90px;
    height:90px;
    margin:20px auto 10px;
    border-radius:50%;
    background: radial-gradient(circle, #fff, #ffd60a, #ff4d6d);
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:40px;
    box-shadow:0 0 20px rgba(255,200,0,0.7);
    animation: glow 2s infinite alternate;
}

@keyframes glow{
    from{transform:scale(1);}
    to{transform:scale(1.08);}
}

/* 🌟 HERO */
.hero{
    text-align:center;
    padding:20px;
}

.hero h1{
    font-size:42px;
    margin:10px 0;
    color:#222;
}

.hero p{
    font-size:18px;
    color:#444;
}

/* 🎈 ONLY 3 BALLOONS (LESS CLUTTER) */
.balloon{
    position:absolute;
    width:40px;
    height:55px;
    border-radius:50%;
    animation: float 10s infinite ease-in-out;
    opacity:0.85;
}

.balloon:after{
    content:"";
    position:absolute;
    width:2px;
    height:40px;
    background:#444;
    top:55px;
    left:20px;
}

.b1{background:#ff4d4d; left:15%; animation-duration:7s;}
.b2{background:#00bbf9; left:50%; animation-duration:9s;}
.b3{background:#38b000; left:80%; animation-duration:8s;}

@keyframes float{
    0%{transform:translateY(110vh);}
    100%{transform:translateY(-200px);}
}

/* 🧸 KIDS CARDS */
.kid-section{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:15px;
    margin-top:20px;
}

.kid-card{
    width:180px;
    padding:15px;
    border-radius:15px;
    text-align:center;
    background:white;
    box-shadow:0 8px 15px rgba(0,0,0,0.1);
    transition:0.3s;
}

.kid-card:hover{
    transform:scale(1.1);
}

.kid-card:nth-child(1){background:#fff3b0;}
.kid-card:nth-child(2){background:#bde0fe;}
.kid-card:nth-child(3){background:#caffbf;}

.badge{
    display:inline-block;
    padding:6px 12px;
    background:#ff4d6d;
    color:white;
    border-radius:20px;
    font-size:12px;
    margin-top:8px;
}

/* 📱 RESPONSIVE */
@media(max-width:600px){
    .hero h1{font-size:28px;}
    .kid-card{width:80%;}
}
</style>
</head>

<body>

<!-- 🎈 BALLOONS (LESS) -->
<div class="balloon b1"></div>
<div class="balloon b2"></div>
<div class="balloon b3"></div>

<!-- 🪄 LOGO -->
<div class="logo">🎓</div>

<!-- 🌈 HEADER -->
<div class="header">
Happy Kids Tuition
</div>

<!-- HERO TEXT -->
<div class="hero">
<h1>Learning Made Fun 🌈</h1>
<p>Where small kids grow into bright stars ⭐</p>

<div class="kid-section">

<div class="kid-card">
🧒<br>
Fun Learning<br>
<div class="badge">Play + Study</div>
</div>

<div class="kid-card">
📚<br>
Smart Classes<br>
<div class="badge">Easy Notes</div>
</div>

<div class="kid-card">
🎨<br>
Creative Growth<br>
<div class="badge">Activity Based</div>
</div>

</div>

</div>

</body>
</html>
