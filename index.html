<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Aanchal Classes | Learn • Play • Grow</title>

<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Baloo 2',cursive;
}

html{
scroll-behavior:smooth;
}

body{
background:#f8fcff;
overflow-x:hidden;
color:#333;
}

/* NAVBAR */

nav{
position:fixed;
top:0;
left:0;
width:100%;
padding:15px 8%;
display:flex;
justify-content:space-between;
align-items:center;
background:rgba(255,255,255,.85);
backdrop-filter:blur(10px);
z-index:1000;
box-shadow:0 2px 15px rgba(0,0,0,.08);
}

.logo{
font-size:32px;
font-weight:800;
color:#ff5757;
}

nav ul{
display:flex;
list-style:none;
gap:20px;
}

nav a{
text-decoration:none;
font-weight:700;
color:#444;
}

/* HERO */

.hero{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
position:relative;
overflow:hidden;

background:
linear-gradient(
-45deg,
#ff5757,
#ffd93d,
#6bcb77,
#4d96ff,
#ff85c2
);

background-size:400% 400%;

animation:rainbow 12s ease infinite;
}

@keyframes rainbow{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.hero-content{
position:relative;
z-index:5;
color:white;
padding:20px;
}

.hero h1{
font-size:5rem;
font-weight:800;
line-height:1.1;
text-shadow:0 5px 15px rgba(0,0,0,.2);
}

.hero p{
font-size:1.5rem;
margin-top:10px;
}

.join-btn{
display:inline-block;
margin-top:25px;
padding:15px 35px;
background:white;
color:#ff5757;
text-decoration:none;
font-size:22px;
font-weight:800;
border-radius:50px;
transition:.3s;
box-shadow:0 10px 25px rgba(0,0,0,.15);
}

.join-btn:hover{
transform:translateY(-6px) scale(1.05);
}

/* FLOATING CLOUDS */

.cloud{
position:absolute;
font-size:80px;
opacity:.9;
}

.c1{
top:80px;
left:-100px;
animation:cloudMove 28s linear infinite;
}

.c2{
top:220px;
left:-200px;
animation:cloudMove 36s linear infinite;
}

.c3{
top:350px;
left:-150px;
animation:cloudMove 32s linear infinite;
}

@keyframes cloudMove{
from{
transform:translateX(-200px);
}
to{
transform:translateX(140vw);
}
}

/* BALLOONS */

.balloon{
position:absolute;
font-size:70px;
animation:floatBalloon 4s ease-in-out infinite;
}

.b1{
left:8%;
bottom:80px;
}

.b2{
right:10%;
bottom:120px;
}

.b3{
right:20%;
top:140px;
}

@keyframes floatBalloon{
50%{
transform:translateY(-20px);
}
}

/* FLOATING STARS */

.star{
position:absolute;
font-size:35px;
animation:twinkle 2s infinite;
}

.s1{
top:120px;
right:25%;
}

.s2{
top:260px;
left:18%;
}

.s3{
top:180px;
right:10%;
}

@keyframes twinkle{
50%{
transform:scale(1.3);
}
}

/* GENERAL SECTION */

.section{
padding:90px 8%;
}

.title{
text-align:center;
font-size:3rem;
margin-bottom:40px;
color:#4d96ff;
font-weight:800;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:25px;
}

.card{
background:white;
padding:25px;
border-radius:30px;
box-shadow:0 10px 25px rgba(0,0,0,.08);
transition:.3s;
text-align:center;
}

.card:hover{
transform:translateY(-10px) rotate(2deg);
}

.red{
border-top:10px solid #ff5757;
}

.blue{
border-top:10px solid #4d96ff;
}

.green{
border-top:10px solid #6bcb77;
}

.yellow{
border-top:10px solid #ffd93d;
}

.fee{
font-size:30px;
font-weight:800;
margin-top:10px;
}

@media(max-width:768px){

.hero h1{
font-size:3rem;
}

.hero p{
font-size:1.1rem;
}

nav ul{
display:none;
}

.cloud{
font-size:50px;
}

.balloon{
font-size:45px;
}

}

</style>
</head>
<body>

<nav>

<div class="logo">
🌈 Aanchal Classes
</div>

<ul>
<li><a href="#fees">Fees</a></li>
<li><a href="#reviews">Reviews</a></li>
<li><a href="#contact">Contact</a></li>
</ul>

</nav>

<section class="hero">

<div class="cloud c1">☁️</div>
<div class="cloud c2">☁️</div>
<div class="cloud c3">☁️</div>

<div class="balloon b1">🎈</div>
<div class="balloon b2">🎈</div>
<div class="balloon b3">🎈</div>

<div class="star s1">⭐</div>
<div class="star s2">⭐</div>
<div class="star s3">⭐</div>

<div class="hero-content">

<div style="font-size:90px;">
👦📚👧
</div>

<h1>
Learn • Play • Grow
</h1>

<p>
Classes 3rd to 8th • All Subjects • Maths Specialist
</p>

<a href="#contact" class="join-btn">
🎓 Admissions Open
</a>

</div>

</section>
